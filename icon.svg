<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0b0c10"/>
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1f2833" stroke-width="12"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#45a29e" stroke-width="4" opacity="0.5"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#66fcf1" stroke-width="2" opacity="0.8"/>
  
  <!-- Geometry: Merkaba / Sefirot / Oracle eye hybrid -->
  <g transform="translate(256 256)">
    <!-- Interlocking triangles (Star of David / Merkaba hint) -->
    <polygon points="0,-120 104,60 -104,60" fill="none" stroke="#45a29e" stroke-width="6"/>
    <polygon points="0,120 104,-60 -104,-60" fill="none" stroke="#45a29e" stroke-width="6"/>
    
    <!-- Central Eye of the Oracle -->
    <path d="M -80,0 Q 0,-60 80,0 Q 0,60 -80,0" fill="#1f2833" stroke="#66fcf1" stroke-width="8"/>
    <circle cx="0" cy="0" r="30" fill="#66fcf1"/>
    <circle cx="0" cy="0" r="15" fill="#0b0c10"/>
    
    <!-- Nodes (Sefirot) -->
    <circle cx="0" cy="-120" r="12" fill="#66fcf1"/>
    <circle cx="104" cy="60" r="12" fill="#66fcf1"/>
    <circle cx="-104" cy="60" r="12" fill="#66fcf1"/>
    <circle cx="0" cy="120" r="12" fill="#45a29e"/>
    <circle cx="104" cy="-60" r="12" fill="#45a29e"/>
    <circle cx="-104" cy="-60" r="12" fill="#45a29e"/>
  </g>
  
  <!-- Kinetic/Quantum lines radiating -->
  <line x1="256" y1="36" x2="256" y2="76" stroke="#66fcf1" stroke-width="4" stroke-dasharray="8 4"/>
  <line x1="256" y1="476" x2="256" y2="436" stroke="#66fcf1" stroke-width="4" stroke-dasharray="8 4"/>
  <line x1="36" y1="256" x2="76" y2="256" stroke="#66fcf1" stroke-width="4" stroke-dasharray="8 4"/>
  <line x1="476" y1="256" x2="436" y2="256" stroke="#66fcf1" stroke-width="4" stroke-dasharray="8 4"/>
</svg>